[project]
name = "hamed-rl-summative"
version = "0.1.0"
description = "AgriResilience RL: smallholder maize farm management in Njoro, Nakuru County, with DQN, REINFORCE, PPO and A2C"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.5",
    "torchrl>=0.15",
    "tensordict>=0.15",
    "gymnasium>=1.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "pyyaml>=6",
    "python-docx>=1.1",
    "pillow>=10",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: tests that train for more than a few seconds"]
